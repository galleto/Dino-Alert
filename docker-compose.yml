services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: dinoalert_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dinoalert
      POSTGRES_PASSWORD: dinoalert
      POSTGRES_DB: dinoalert
    ports:
      - "5432:5432"
    volumes:
      - dinoalert_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dinoalert -d dinoalert"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dinoalert_pgdata:
